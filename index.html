<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>PAWket - Couple Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { 
            // Palet Hijau Sage Baru
            sage: { 50: '#f4f9f4', 100: '#e3efe3', 400: '#84a98c', 500: '#52796f', 600: '#354f52' } 
          },
          fontFamily: { sans: ['Quicksand', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { background-color: #f4f9f4; -webkit-tap-highlight-color: transparent; }
    .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
    .hide { display: none !important; }
  </style>
</head>
<body class="text-gray-700 antialiased bg-gray-100 flex justify-center min-h-screen">

  <!-- Container Pembatas Layar -->
  <div class="w-full max-w-md bg-sage-50 shadow-2xl relative flex flex-col min-h-screen overflow-hidden">

    <!-- ================= SCREEN LOGIN ================= -->
    <div id="loginScreen" class="absolute inset-0 z-50 bg-sage-50 flex flex-col items-center justify-center p-6">
      <i class="fa-solid fa-cat text-sage-500 text-6xl mb-4"></i>
      <h1 class="text-3xl font-bold text-gray-800 mb-8 tracking-tight">PAWket <i class="fa-solid fa-paw text-sage-400 text-xl"></i></h1>
      <div class="glass w-full max-w-sm rounded-3xl p-6 shadow-xl">
        <input type="text" id="username" placeholder="Username" class="w-full bg-white border border-gray-100 rounded-xl px-4 py-3 mb-4 focus:ring-2 focus:ring-sage-400 outline-none font-semibold">
        <input type="password" id="password" placeholder="Password" class="w-full bg-white border border-gray-100 rounded-xl px-4 py-3 mb-6 focus:ring-2 focus:ring-sage-400 outline-none font-semibold">
        <button onclick="prosesLogin()" id="btnLogin" class="w-full bg-sage-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-sage-500/30 hover:bg-sage-600 transition active:scale-95">Masuk</button>
      </div>
    </div>

    <!-- ================= SCREEN MAIN APP ================= -->
    <div id="appScreen" class="hide flex-1 flex flex-col h-full overflow-y-auto pb-24">
      
      <!-- Header -->
      <header class="p-6 pb-4 glass sticky top-0 z-20 flex justify-between items-center rounded-b-3xl shadow-sm mb-6">
        <div>
          <p class="text-sm font-semibold text-gray-500">Halo, <span id="namaUser" class="text-sage-500"></span>! 🐾</p>
          <h2 class="text-2xl font-bold text-gray-800">Keuangan Kita</h2>
        </div>
        <!-- Tombol Logout -->
        <button onclick="prosesLogout()" class="h-10 w-10 bg-sage-100 rounded-full flex items-center justify-center shadow-inner hover:bg-sage-200 transition" title="Keluar">
          <i class="fa-solid fa-right-from-bracket text-sage-500"></i>
        </button>
      </header>

      <!-- Area Konten (Tabs) -->
      <div class="flex-1 relative">
        
        <!-- TAB: DASHBOARD -->
        <div id="tab-dashboard" class="px-6 space-y-6">
          <!-- Saldo Card -->
          <div class="bg-gradient-to-br from-sage-500 to-sage-400 rounded-3xl p-6 text-white shadow-xl shadow-sage-500/20 relative overflow-hidden">
            <i class="fa-solid fa-paw absolute -bottom-4 -right-4 text-8xl opacity-10"></i>
            <p class="text-sage-50 font-semibold mb-1">Saldo Dompet Utama</p>
            <h3 class="text-4xl font-bold mb-4 truncate" id="saldoUtama">Rp 0</h3>
            <div class="flex justify-between text-sm bg-white/20 p-3 rounded-2xl backdrop-blur-md">
              <div><span class="opacity-80">Masuk:</span> <br><span class="font-bold truncate" id="totalMasuk">Rp 0</span></div>
              <div class="text-right"><span class="opacity-80">Keluar:</span> <br><span class="font-bold truncate" id="totalKeluar">Rp 0</span></div>
            </div>
          </div>

          <!-- Tabungan Mini Cards -->
          <h4 class="font-bold text-gray-800 mb-2 mt-6">Kantong Tabungan <i class="fa-solid fa-box text-sage-400"></i></h4>
          <div class="grid grid-cols-2 gap-4">
            <div class="glass rounded-2xl p-4 shadow-sm">
              <p class="text-xs text-gray-500 font-semibold">Simpanan</p>
              <p class="font-bold text-gray-800 truncate" id="tabSimpanan">Rp 0</p>
            </div>
            <div class="glass rounded-2xl p-4 shadow-sm">
              <p class="text-xs text-gray-500 font-semibold">Liburan</p>
              <p class="font-bold text-gray-800 truncate" id="tabLiburan">Rp 0</p>
            </div>
          </div>

          <!-- Area Grafik Minimalis -->
          <div class="mt-4 grid grid-cols-1 gap-4 mb-6">
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100">
              <div class="flex justify-between items-center mb-2">
                <h4 class="font-bold text-gray-800 text-xs"><i class="fa-solid fa-chart-column text-sage-400"></i> Rekap</h4>
                <button onclick="editTarget()" id="btnEditTarget" class="text-[10px] bg-sage-50 text-sage-500 px-2 py-1 rounded-full font-bold hover:bg-sage-100 transition shadow-sm border border-sage-100">
                  <i class="fa-solid fa-pen"></i> Edit Target
                </button>
              </div>
              <div class="relative h-40 w-full">
                <canvas id="barChart"></canvas>
              </div>
            </div>

            <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 flex items-center justify-between">
              <h4 class="font-bold text-gray-800 text-xs"><i class="fa-solid fa-chart-pie text-sage-400"></i> Arus Kas</h4>
              <div class="relative h-24 w-24">
                <canvas id="pieChart"></canvas>
              </div>
            </div>
          </div>
        </div>

        <!-- TAB: CATAT TRANSAKSI -->
        <div id="tab-catat" class="hide px-6">
          <div class="glass rounded-3xl p-6 shadow-xl relative overflow-hidden">
            <h3 class="text-xl font-bold text-gray-800 mb-4">Catat Transaksi <i class="fa-solid fa-pen text-sage-400 text-sm"></i></h3>
            
            <div class="mb-5 relative">
              <input type="file" id="fotoStruk" accept="image/*" capture="environment" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="prosesScanAI()">
              <div id="btnScanUi" class="w-full bg-gray-800 text-white rounded-xl p-3 flex justify-center items-center gap-2 font-bold shadow-lg active:scale-95 transition">
                <i class="fa-solid fa-camera"></i> Foto Struk (Scan AI)
              </div>
            </div>

            <div class="flex gap-2 mb-4 bg-gray-100 p-1 rounded-xl">
              <button id="btnPemasukan" onclick="setTipe('Pemasukan')" class="flex-1 py-2 rounded-lg font-bold text-gray-500 transition">Pemasukan</button>
              <button id="btnPengeluaran" onclick="setTipe('Pengeluaran')" class="flex-1 py-2 rounded-lg font-bold bg-white text-sage-500 shadow transition">Pengeluaran</button>
            </div>

            <div class="space-y-4">
              <div>
                <label class="text-sm font-semibold text-gray-600 ml-1">Kategori</label>
                <!-- Menambahkan Default Kosong agar aksi onchange berjalan -->
                <select id="inputKategori" onchange="cekKategoriBaru()" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-sage-400 outline-none font-semibold text-gray-700"></select>
              </div>
              <div>
                <label class="text-sm font-semibold text-gray-600 ml-1">Nominal (Rp)</label>
                <input type="number" id="inputNominal" placeholder="Contoh: 50000" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-sage-400 outline-none font-bold text-lg text-gray-800">
              </div>
              <div>
                <label class="text-sm font-semibold text-gray-600 ml-1">Catatan</label>
                <input type="text" id="inputCatatan" placeholder="Makan sushi berdua..." class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-sage-400 outline-none font-semibold">
              </div>
              
              <button onclick="simpanTransaksi()" id="btnSimpan" class="w-full mt-2 bg-sage-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-sage-500/30 hover:bg-sage-600 transition active:scale-95">Simpan Data</button>
            </div>
          </div>
        </div>

        <!-- TAB: REKAP BULANAN -->
        <div id="tab-rekap" class="hide px-6 h-full flex flex-col">
          <div class="glass rounded-3xl p-6 shadow-xl relative overflow-hidden flex-1 flex flex-col">
            <i class="fa-solid fa-calendar-days absolute -bottom-2 -right-4 text-8xl text-sage-400 opacity-5"></i>
            <h3 class="text-xl font-bold text-gray-800 mb-4">Rekap Bulanan <i class="fa-solid fa-chart-pie text-sage-400 text-sm"></i></h3>
            
            <input type="month" id="inputBulan" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 mb-4 focus:ring-2 focus:ring-sage-400 outline-none font-bold text-gray-700 shrink-0" onchange="loadRekap()">
            
            <div class="grid grid-cols-2 gap-4 mb-5 shrink-0">
              <div class="bg-sage-50 rounded-2xl p-4 shadow-sm border border-sage-100">
                <p class="text-xs text-gray-500 font-semibold mb-1">Pemasukan</p>
                <p class="font-bold text-sage-500 truncate" id="rekapMasuk">Rp 0</p>
              </div>
              <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                <p class="text-xs text-gray-500 font-semibold mb-1">Pengeluaran</p>
                <p class="font-bold text-gray-800 truncate" id="rekapKeluar">Rp 0</p>
              </div>
            </div>

            <button onclick="exportXLS()" id="btnExport" class="w-full bg-[#107c41] text-white font-bold py-3 rounded-xl shadow-lg shadow-green-700/20 hover:bg-green-700 transition active:scale-95 mb-4 flex items-center justify-center gap-2 shrink-0">
              <i class="fa-solid fa-file-excel"></i> Download XLS
            </button>
            
            <h4 class="font-bold text-gray-800 mb-3 text-sm shrink-0">Rincian Transaksi</h4>
            <div id="listRekap" class="space-y-3 flex-1 overflow-y-auto pr-1">
              <p class="text-center text-gray-400 text-sm py-4">Pilih bulan terlebih dahulu 🐾</p>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Bottom Navigation (Diberi ID agar bisa disembunyikan saat belum login) -->
    <nav id="bottomNav" class="hide absolute bottom-0 left-0 w-full glass border-t border-gray-100 rounded-t-3xl flex justify-around p-3 text-gray-400 z-50">
      <button onclick="switchTab('dashboard')" class="flex flex-col items-center w-16 text-sage-500" id="nav-dashboard">
        <i class="fa-solid fa-cat text-2xl mb-1"></i><span class="text-[10px] font-bold">Beranda</span>
      </button>
      <button onclick="switchTab('catat')" class="flex flex-col items-center w-16 hover:text-sage-400 transition" id="nav-catat">
        <i class="fa-solid fa-paw text-2xl mb-1"></i><span class="text-[10px] font-bold">Catat</span>
      </button>
      <button onclick="switchTab('rekap')" class="flex flex-col items-center w-16 hover:text-sage-400 transition" id="nav-rekap">
        <i class="fa-solid fa-chart-simple text-2xl mb-1"></i><span class="text-[10px] font-bold">Rekap</span>
      </button>
    </nav>

  </div>

  <script>
    // URL Web App Apps Script (REST API Endpoint)
    const API_URL = "https://script.google.com/macros/s/AKfycbzufhYyOQwVmj0qEPWd_vZwYHh-nnGo5iKNQrZFMXBHJcoFOvECMkr1qg0Y-VB7kpGf/exec";

    async function callAPI(action, payload = {}) {
      payload.action = action;
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        return await response.json();
      } catch (error) {
        console.error("Gagal terhubung ke server:", error);
        return { sukses: false, pesan: "Gagal terhubung ke database." };
      }
    }
    
    let activeUser = "";
    let tipeAktif = "Pengeluaran";
    let listKategori = { masuk: [], keluar: [] };
    let dataRekapBulanIni = [];
    let barChartInstance = null;
    let pieChartInstance = null;

    const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);

    // --- Login & Logout ---
    async function prosesLogin() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const btn = document.getElementById('btnLogin');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
      
      const res = await callAPI('login', { username: u, password: p });
      
      if(res.sukses) {
        activeUser = res.nama;
        document.getElementById('namaUser').innerText = activeUser;
        document.getElementById('loginScreen').classList.add('hide');
        document.getElementById('appScreen').classList.remove('hide');
        document.getElementById('bottomNav').classList.remove('hide'); // Memunculkan navigasi
        loadDataDashboard();
        loadKategori();
      } else {
        alert(res.pesan);
        btn.innerHTML = 'Masuk';
      }
    }

    function prosesLogout() {
      activeUser = "";
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      document.getElementById('btnLogin').innerHTML = 'Masuk';
      
      document.getElementById('appScreen').classList.add('hide');
      document.getElementById('bottomNav').classList.add('hide');
      document.getElementById('loginScreen').classList.remove('hide');
      
      if (barChartInstance) barChartInstance.destroy();
      if (pieChartInstance) pieChartInstance.destroy();
      switchTab('dashboard'); // reset tab ke beranda
    }

    // --- Load Data Dashboard & Charts ---
    async function loadDataDashboard() {
      const res = await callAPI('getDashboard');
      
      if (!res || res.sukses === false) return;

      document.getElementById('saldoUtama').innerText = formatRp(res.saldoUtama);
      document.getElementById('totalMasuk').innerText = formatRp(res.totalMasuk);
      document.getElementById('totalKeluar').innerText = formatRp(res.totalKeluar);
      document.getElementById('tabSimpanan').innerText = formatRp(res.tabungan['Simpanan'] || 0);
      document.getElementById('tabLiburan').innerText = formatRp(res.tabungan['Liburan'] || 0);

      const sisaUang = res.saldoUtama;
      const pemasukan = res.totalMasuk;
      const pengeluaran = res.totalKeluar;
      const sisaHutang = res.totalSisaHutang || 0;
      
      const totalTabunganTerkumpul = (res.tabungan['Simpanan'] || 0) + (res.tabungan['Liburan'] || 0) + (res.tabungan['Keperluan Lainnya'] || 0);
      const sisaTargetTabungan = Math.max(0, res.targetTabungan - totalTabunganTerkumpul);

      const ctxBar = document.getElementById('barChart').getContext('2d');
      if (barChartInstance) barChartInstance.destroy();
      barChartInstance = new Chart(ctxBar, {
        type: 'bar',
        data: {
          labels: ['Sisa Uang', 'Pemasukan', 'Pengeluaran', 'Sisa Hutang', 'Sisa Target'],
          datasets: [{
            data: [sisaUang, pemasukan, pengeluaran, sisaHutang, sisaTargetTabungan],
            backgroundColor: ['#10b981', '#3b82f6', '#52796f', '#ef4444', '#8b5cf6'], // Menggunakan Sage green
            borderRadius: 6
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: (context) => formatRp(context.raw) } } },
          scales: { 
            y: { beginAtZero: true, ticks: { callback: value => 'Rp ' + (value/1000) + 'k', font: { family: 'Quicksand', size: 10 } } },
            x: { ticks: { font: { family: 'Quicksand', size: 9 } } }
          }
        }
      });

      const ctxPie = document.getElementById('pieChart').getContext('2d');
      if (pieChartInstance) pieChartInstance.destroy();
      
      const isDataKosong = pemasukan === 0 && pengeluaran === 0;
      pieChartInstance = new Chart(ctxPie, {
        type: 'doughnut',
        data: {
          labels: ['Pemasukan', 'Pengeluaran'],
          datasets: [{
            data: isDataKosong ? [1] : [pemasukan, pengeluaran],
            backgroundColor: isDataKosong ? ['#e5e7eb'] : ['#3b82f6', '#52796f'], // Menggunakan Sage green
            borderWidth: 0, hoverOffset: 4
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '65%',
          plugins: { 
            legend: { display: false },
            tooltip: { callbacks: { label: (context) => isDataKosong ? ' Belum ada data' : ' ' + formatRp(context.raw) } }
          }
        }
      });
    }

    // --- Manajemen Kategori ---
    async function loadKategori() {
      const res = await callAPI('getKategori');
      if (res && res.masuk) {
        listKategori = res;
        renderKategori();
      }
    }

    function renderKategori() {
      const select = document.getElementById('inputKategori');
      // Menambahkan opsi default kosong agar event onchange bisa mendeteksi klik "Tambah Kategori Baru"
      select.innerHTML = '<option value="" disabled selected>-- Pilih Kategori --</option>'; 
      
      const arr = tipeAktif === 'Pemasukan' ? listKategori.masuk : listKategori.keluar;
      arr.forEach(k => {
        let opt = document.createElement('option');
        opt.value = k; opt.innerText = k;
        select.appendChild(opt);
      });
      
      let optAdd = document.createElement('option');
      optAdd.value = "ADD_NEW"; optAdd.innerText = "+ Tambah Kategori Baru";
      optAdd.className = "text-sage-500 font-bold";
      select.appendChild(optAdd);
    }

    function setTipe(tipe) {
      tipeAktif = tipe;
      document.getElementById('btnPemasukan').className = tipe === 'Pemasukan' ? "flex-1 py-2 rounded-lg font-bold bg-white text-sage-500 shadow transition" : "flex-1 py-2 rounded-lg font-bold text-gray-500 transition";
      document.getElementById('btnPengeluaran').className = tipe === 'Pengeluaran' ? "flex-1 py-2 rounded-lg font-bold bg-white text-sage-500 shadow transition" : "flex-1 py-2 rounded-lg font-bold text-gray-500 transition";
      renderKategori();
    }

    async function cekKategoriBaru() {
      const select = document.getElementById('inputKategori');
      if (select.value === "ADD_NEW") {
        let kategoriBaru = prompt(`Masukkan nama kategori ${tipeAktif} baru:`);
        if (kategoriBaru && kategoriBaru.trim() !== "") {
          select.disabled = true;
          const res = await callAPI('tambahKategori', { tipe: tipeAktif, namaKategori: kategoriBaru.trim() });
          
          if(res && res.masuk) {
            listKategori = res;
            renderKategori();
            select.value = kategoriBaru.trim();
          }
          select.disabled = false;
        } else {
          select.value = ""; // Mereset form jika prompt dibatalkan
        }
      }
    }

    // --- Scan Struk ---
    function prosesScanAI() {
      const file = document.getElementById('fotoStruk').files[0];
      if(!file) return;

      const btnUi = document.getElementById('btnScanUi');
      btnUi.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Membaca Struk...';
      
      const reader = new FileReader();
      reader.onload = async function(e) {
        const base64 = e.target.result.split(',')[1];
        const res = await callAPI('scanStruk', { base64: base64, mimeType: file.type });
        
        if(res.sukses) {
          setTipe('Pengeluaran');
          document.getElementById('inputNominal').value = res.hasil.nominal;
          document.getElementById('inputCatatan').value = res.hasil.catatan;
          if(listKategori.keluar.includes(res.hasil.kategori)) {
            document.getElementById('inputKategori').value = res.hasil.kategori;
          }
          alert("Struk berhasil dibaca AI! 🐾 Cek kembali nominalnya.");
        } else {
          alert(res.pesan || "Gagal membaca struk.");
        }
        btnUi.innerHTML = '<i class="fa-solid fa-camera"></i> Foto Struk (Scan AI)';
      };
      reader.readAsDataURL(file);
    }

    // --- Simpan Transaksi ---
    async function simpanTransaksi() {
      const form = {
        tanggal: new Date().toISOString().split('T')[0],
        oleh: activeUser,
        tipe: tipeAktif,
        kategori: document.getElementById('inputKategori').value,
        nominal: document.getElementById('inputNominal').value,
        catatan: document.getElementById('inputCatatan').value
      };
      
      if(!form.nominal || !form.kategori) return alert('Nominal & Kategori wajib diisi!');
      
      const btn = document.getElementById('btnSimpan');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';
      btn.disabled = true;
      
      const res = await callAPI('tambahTransaksi', { form: form });
      
      if (res && res.sukses) {
        alert("Berhasil dicatat! 🐾");
        document.getElementById('inputNominal').value = '';
        document.getElementById('inputCatatan').value = '';
        document.getElementById('inputKategori').value = '';
        loadDataDashboard();
        switchTab('dashboard');
      } else {
        alert("Gagal menyimpan transaksi.");
      }
      btn.innerHTML = 'Simpan Data';
      btn.disabled = false;
    }

    // --- Tab Navigation Switcher ---
    function switchTab(tabId) {
      document.getElementById('tab-dashboard').classList.add('hide');
      document.getElementById('tab-catat').classList.add('hide');
      document.getElementById('tab-rekap').classList.add('hide');
      
      document.getElementById('nav-dashboard').classList.replace('text-sage-500', 'text-gray-400');
      document.getElementById('nav-catat').classList.replace('text-sage-500', 'text-gray-400');
      document.getElementById('nav-rekap').classList.replace('text-sage-500', 'text-gray-400');
      
      document.getElementById('tab-' + tabId).classList.remove('hide');
      document.getElementById('nav-' + tabId).classList.replace('text-gray-400', 'text-sage-500');
    }

    // --- Rekap Bulanan ---
    async function loadRekap() {
      const bln = document.getElementById('inputBulan').value;
      if(!bln) return;
      
      const listUi = document.getElementById('listRekap');
      listUi.innerHTML = '<p class="text-center text-gray-400 text-sm py-4"><i class="fa-solid fa-spinner fa-spin text-sage-400 text-2xl mb-2"></i><br>Membongkar catatan...</p>';
      
      const res = await callAPI('getRekap', { bulanTahun: bln });
      
      if(res && res.detail) {
        document.getElementById('rekapMasuk').innerText = formatRp(res.totalMasuk);
        document.getElementById('rekapKeluar').innerText = formatRp(res.totalKeluar);
        dataRekapBulanIni = res.detail; 
        
        let html = '';
        if(res.detail.length === 0) {
          html = '<p class="text-center text-gray-400 text-sm py-4">Belum ada transaksi di bulan ini 🐾</p>';
        } else {
          res.detail.forEach(d => {
            const isMasuk = d.Tipe === 'Pemasukan';
            const icon = isMasuk ? '<i class="fa-solid fa-arrow-down text-sage-500 bg-sage-100 p-2 rounded-lg"></i>' : '<i class="fa-solid fa-arrow-up text-gray-500 bg-gray-100 p-2 rounded-lg"></i>';
            const color = isMasuk ? 'text-sage-500' : 'text-gray-800';
            
            html += `
              <div class="flex justify-between items-center bg-white p-3 rounded-xl shadow-sm border border-gray-50">
                <div class="flex items-center gap-3">
                  ${icon}
                  <div>
                    <p class="font-bold text-sm text-gray-800">${d.Kategori}</p>
                    <p class="text-[10px] text-gray-400">${d.Tanggal} • ${d.Oleh} <br> <span class="italic">${d.Catatan}</span></p>
                  </div>
                </div>
                <div class="font-bold text-sm ${color}">${formatRp(d.Nominal)}</div>
              </div>
            `;
          });
        }
        listUi.innerHTML = html;
      }
    }

    function exportXLS() {
      if(dataRekapBulanIni.length === 0) return alert("Tidak ada data untuk diexport! Pilih bulan yang ada transaksinya.");
      const bln = document.getElementById('inputBulan').value;
      const ws = XLSX.utils.json_to_sheet(dataRekapBulanIni);
      const wscols = [{wch: 15}, {wch: 10}, {wch: 12}, {wch: 20}, {wch: 15}, {wch: 30}];
      ws['!cols'] = wscols;
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Rekap_" + bln);
      XLSX.writeFile(wb, `PAWket_Rekap_${bln}.xlsx`);
    }

    // --- Edit Target Tabungan Dinamis ---
    async function editTarget() {
      const input = prompt("Masukkan target tabungan keseluruhan yang baru (angka saja, tanpa titik/koma):");
      if (input && !isNaN(input) && input.trim() !== "") {
        const btn = document.getElementById('btnEditTarget');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
        btn.disabled = true;

        const res = await callAPI('setTarget', { nominal: Number(input) });
        
        if (res && res.sukses) {
          alert('Target tabungan berhasil diperbarui! 🐾');
          loadDataDashboard(); 
        } else {
          alert('Gagal memperbarui target.');
        }
        btn.innerHTML = originalText;
        btn.disabled = false;
      } else if (input !== null) {
        alert("Gagal. Harap masukkan format angka yang valid.");
      }
    }
  </script>
</body>
</html>
